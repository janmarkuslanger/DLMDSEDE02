name: batch-data-platform

services:
  minio:
    image: cgr.dev/chainguard/minio@sha256:bd92a45b821c0d85772c607ed7b49693efe78b3ffffae301b5d1b0981660de22
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # One-shot: provisions buckets (one per medallion layer) via Terraform.
  # Users and policies for least privilege are added in a later step.
  minio-provision:
    image: hashicorp/terraform:1.9
    depends_on:
      - minio
    working_dir: /infra
    environment:
      TF_IN_AUTOMATION: "1"
      TF_VAR_minio_endpoint: minio:9000
      TF_VAR_minio_user: ${MINIO_ROOT_USER}
      TF_VAR_minio_password: ${MINIO_ROOT_PASSWORD}
      TF_VAR_ingestion_secret: ${INGESTION_S3_SECRET}
      TF_VAR_spark_secret: ${SPARK_S3_SECRET}
      TF_VAR_orchestration_secret: ${ORCHESTRATION_S3_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        terraform init -input=false &&
        terraform apply -input=false -auto-approve
    volumes:
      - ./infra/terraform:/infra
    restart: "no"

  # One-shot: splits the Kaggle dataset (data/online_retail_II.zip) into monthly files.
  seed:
    image: python:3.12-slim
    command: ["python", "/source/seed.py", "/data/online_retail_II.zip", "/data/slices"]
    volumes:
      - ./source/seed.py:/source/seed.py:ro
      - ./data:/data
    restart: "no"

  # Simulated external source: serves one CSV export per month.
  data-source:
    image: nginx:alpine
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - ./data/slices:/usr/share/nginx/html:ro
    restart: unless-stopped

  ingestion:
    build: ./ingestion
    depends_on:
      data-source:
        condition: service_started
      minio-provision:
        condition: service_completed_successfully
    environment:
      SOURCE_URL: http://data-source
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ingestion
      S3_SECRET_KEY: ${INGESTION_S3_SECRET}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  spark-master:
    build: ./processing
    image: batch-data-platform/spark:3.5.3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  spark-worker:
    image: batch-data-platform/spark:3.5.3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master
    deploy:
      replicas: 2
    restart: unless-stopped

  # One-shot job runner (profile "jobs"), e.g.:
  #   docker compose run --rm spark-job /jobs/bronze_to_silver.py --quarter 2010Q1
  spark-job:
    image: batch-data-platform/spark:3.5.3
    profiles: ["jobs"]
    depends_on:
      - spark-master
      - minio
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: spark
      S3_SECRET_KEY: ${SPARK_S3_SECRET}
      PSEUDONYM_SALT: ${PSEUDONYM_SALT}
      SERVING_DB_NAME: ${SERVING_DB_NAME}
      SERVING_DB_USER: ${SERVING_DB_USER}
      SERVING_DB_PASSWORD: ${SERVING_DB_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - >
        exec /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --conf spark.driver.host=$$(hostname -i)
        "$$@"
      - spark-submit
    volumes:
      - ./processing/jobs:/jobs:ro

  airflow:
    build: ./orchestration
    image: batch-data-platform/airflow:3.1.0
    depends_on:
      airflow-db:
        condition: service_healthy
      spark-master:
        condition: service_started
      ingestion:
        condition: service_started
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      # Used by the DAGs
      INGESTION_URL: http://ingestion:8000
      SPARK_MASTER: spark://spark-master:7077
      S3_ENDPOINT: http://minio:9000
      ORCHESTRATION_S3_SECRET: ${ORCHESTRATION_S3_SECRET}
      SPARK_S3_SECRET: ${SPARK_S3_SECRET}
      # Passed through to the spark-submit jobs
      PSEUDONYM_SALT: ${PSEUDONYM_SALT}
      SERVING_DB_NAME: ${SERVING_DB_NAME}
      SERVING_DB_USER: ${SERVING_DB_USER}
      SERVING_DB_PASSWORD: ${SERVING_DB_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "{\"admin\": \"$$AIRFLOW_ADMIN_PASSWORD\"}" > /opt/airflow/simple_auth_passwords.json
        exec airflow standalone
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./orchestration/dags:/opt/airflow/dags:ro
      - ./processing/jobs:/opt/airflow/jobs:ro
    restart: unless-stopped

  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  serving-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SERVING_DB_USER}
      POSTGRES_PASSWORD: ${SERVING_DB_PASSWORD}
      POSTGRES_DB: ${SERVING_DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - serving-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVING_DB_USER} -d ${SERVING_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  minio-data:
  airflow-db-data:
  serving-db-data:
